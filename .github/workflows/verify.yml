name: Verify notebook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check repository and notebook structure
        run: python -m unittest discover -s tests -v
      - name: Execute tests and reduced notebook workflow
        run: python tools/run_notebook.py --profile ci --output work/ci-executed.ipynb
      - name: Install dashboard dependencies
        run: python -m pip install -r dashboard/requirements.txt
      - name: Verify dashboard and optimization implementation
        working-directory: dashboard
        run: python -m pytest -q
      - name: Retain executed smoke-test notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smoke-test
          path: work/*.ipynb
          if-no-files-found: warn
